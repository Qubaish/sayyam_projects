<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In / Sign Up</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #667eea, #764ba2);
      padding: 20px;
    }

    .container {
      width: 900px;
      max-width: 100%;
      min-height: 560px;
      background: #fff;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
      display: flex;
      position: relative;
    }

    /* Left panel */
    .welcome-panel {
      width: 45%;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      padding: 60px 40px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .welcome-panel h1 {
      font-size: 36px;
      margin-bottom: 20px;
    }

    .welcome-panel p {
      font-size: 16px;
      line-height: 1.6;
      opacity: 0.9;
      margin-bottom: 30px;
    }

    .welcome-panel button {
      padding: 12px 35px;
      border: 2px solid white;
      background: transparent;
      color: white;
      border-radius: 30px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    .welcome-panel button:hover {
      background: white;
      color: #667eea;
    }

    /* Form section */
    .form-section {
      width: 55%;
      padding: 50px 60px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .form {
      width: 100%;
      max-width: 380px;
      margin: auto;
    }

    .form h2 {
      font-size: 32px;
      color: #222;
      margin-bottom: 10px;
    }

    .form .subtitle {
      color: #777;
      margin-bottom: 30px;
      font-size: 14px;
    }

    .input-group {
      margin-bottom: 18px;
    }

    .input-group label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: #444;
      margin-bottom: 7px;
    }

    .input-group input {
      width: 100%;
      padding: 13px 15px;
      border: 1px solid #ddd;
      border-radius: 8px;
      outline: none;
      font-size: 14px;
      transition: 0.3s;
    }

    .input-group input:focus {
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    .options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      margin-bottom: 20px;
    }

    .remember {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #666;
    }

    .options a {
      color: #667eea;
      text-decoration: none;
    }

    .primary-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    .primary-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 25px 0;
      color: #999;
      font-size: 13px;
    }

    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: #ddd;
    }

    .social-buttons {
      display: flex;
      gap: 10px;
    }

    .social-btn {
      flex: 1;
      padding: 11px;
      border: 1px solid #ddd;
      background: white;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      transition: 0.3s;
    }

    .social-btn:hover {
      background: #f7f7f7;
    }

    .mobile-switch {
      display: none;
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
      color: #666;
    }

    .mobile-switch button {
      border: none;
      background: none;
      color: #667eea;
      font-weight: bold;
      cursor: pointer;
    }

    /* Signup initially hidden */
    #signupForm {
      display: none;
    }

    /* Responsive */
    @media (max-width: 700px) {
      .container {
        min-height: auto;
      }

      .welcome-panel {
        display: none;
      }

      .form-section {
        width: 100%;
        padding: 40px 25px;
      }

      .mobile-switch {
        display: block;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- Welcome Panel -->
    <div class="welcome-panel">
      <h1 id="welcomeTitle">Welcome Back!</h1>

      <p id="welcomeText">
        Don't have an account yet? Create one and start your journey with us.
      </p>

      <button onclick="toggleForm()" id="switchButton">
        Create Account
      </button>
    </div>

    <!-- Forms -->
    <div class="form-section">

      <!-- Sign In -->
      <form class="form" id="signinForm">

        <h2>Sign In</h2>
        <p class="subtitle">Welcome back! Please enter your details.</p>

        <div class="input-group">
          <label>Email Address</label>
          <input
            type="email"
            placeholder="Enter your email"
            required
          />
        </div>

        <div class="input-group">
          <label>Password</label>
          <input
            type="password"
            placeholder="Enter your password"
            required
          />
        </div>

        <div class="options">
          <label class="remember">
            <input type="checkbox" />
            Remember me
          </label>

          <a href="#">Forgot Password?</a>
        </div>

        <button class="primary-btn" type="submit">
          Sign In
        </button>

        <div class="divider">
          OR
        </div>

        <div class="social-buttons">
          <button type="button" class="social-btn">
            Google
          </button>

          <button type="button" class="social-btn">
            Apple
          </button>
        </div>

        <div class="mobile-switch">
          Don't have an account?
          <button type="button" onclick="toggleForm()">
            Sign Up
          </button>
        </div>

      </form>


      <!-- Sign Up -->
      <form class="form" id="signupForm">

        <h2>Create Account</h2>
        <p class="subtitle">Create your account to get started.</p>

        <div class="input-group">
          <label>Full Name</label>
          <input
            type="text"
            placeholder="Enter your full name"
            required
          />
        </div>

        <div class="input-group">
          <label>Email Address</label>
          <input
            type="email"
            placeholder="Enter your email"
            required
          />
        </div>

        <div class="input-group">
          <label>Password</label>
          <input
            type="password"
            placeholder="Create a password"
            required
          />
        </div>

        <div class="input-group">
          <label>Confirm Password</label>
          <input
            type="password"
            placeholder="Confirm your password"
            required
          />
        </div>

        <button class="primary-btn" type="submit">
          Create Account
        </button>

        <div class="divider">
          OR
        </div>

        <div class="social-buttons">
          <button type="button" class="social-btn">
            Google
          </button>

          <button type="button" class="social-btn">
            Apple
          </button>
        </div>

        <div class="mobile-switch">
          Already have an account?
          <button type="button" onclick="toggleForm()">
            Sign In
          </button>
        </div>

      </form>

    </div>
  </div>


  <script>
    function toggleForm() {
      const signinForm = document.getElementById("signinForm");
      const signupForm = document.getElementById("signupForm");

      const welcomeTitle = document.getElementById("welcomeTitle");
      const welcomeText = document.getElementById("welcomeText");
      const switchButton = document.getElementById("switchButton");

      if (signinForm.style.display === "none") {

        signinForm.style.display = "block";
        signupForm.style.display = "none";

        welcomeTitle.textContent = "Welcome Back!";
        welcomeText.textContent =
          "Don't have an account yet? Create one and start your journey with us.";
        switchButton.textContent = "Create Account";

      } else {

        signinForm.style.display = "none";
        signupForm.style.display = "block";

        welcomeTitle.textContent = "Welcome!";
        welcomeText.textContent =
          "Already have an account? Sign in and continue your journey with us.";
        switchButton.textContent = "Sign In";
      }
    }
  </script>

</body>
</html>
